# Production compose — EC2 backend only.
# Frontend is served by AWS Amplify — no frontend service here.
# Compatible with docker-compose v1 (version 2.4 format for mem_limit +
# depends_on service_healthy).
version: "2.4"

services:
  db:
    image: postgres:15
    container_name: vc-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: value_charts_db
    ports:
      - "5432:5432"
    networks:
      - vc-network
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d value_charts_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 768m

  backend:
    build: ./backend
    container_name: vc-backend
    restart: always
    command: npm start
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vc-network
    mem_limit: 1g
    environment:
      DATABASE_URL: postgresql://${DB_USER:-admin}:${DB_PASSWORD:-password}@db:5432/value_charts_db
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      PORT: 5000
      NODE_ENV: production
      APP_URL: ${APP_URL}
      # Stripe
      STRIPE_MODE: ${STRIPE_MODE:-live}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_LIVE_SECRET_KEY: ${STRIPE_LIVE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_LIVE_PUBLISHABLE_KEY: ${STRIPE_LIVE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_CURRENCY: ${STRIPE_CURRENCY:-USD}
      # Stripe — Pro pricing
      STRIPE_PRO_BASE_PRICE: ${STRIPE_PRO_BASE_PRICE}
      STRIPE_PRO_MONTHLY_PRICE: ${STRIPE_PRO_MONTHLY_PRICE}
      STRIPE_PRO_YEARLY_PRICE: ${STRIPE_PRO_YEARLY_PRICE}
      # Stripe — Team pricing
      STRIPE_TEAM_MONTHLY_PRICE: ${STRIPE_TEAM_MONTHLY_PRICE}
      STRIPE_TEAM_YEARLY_PRICE: ${STRIPE_TEAM_YEARLY_PRICE}
      # Stripe — Flow Add-on subscriptions
      STRIPE_FLOW_STANDARD_PRICE_ID: ${STRIPE_FLOW_STANDARD_PRICE_ID}
      STRIPE_FLOW_UNLIMITED_PRICE_ID: ${STRIPE_FLOW_UNLIMITED_PRICE_ID}
      # Stripe — AI credit top-ups
      STRIPE_AI_ADDON_STARTER_PRICE: ${STRIPE_AI_ADDON_STARTER_PRICE}
      STRIPE_AI_ADDON_STANDARD_PRICE: ${STRIPE_AI_ADDON_STANDARD_PRICE}
      STRIPE_AI_ADDON_PROPPACK_PRICE: ${STRIPE_AI_ADDON_PROPPACK_PRICE}
      # RevenueCat (mobile in-app purchases)
      REVENUECAT_WEBHOOK_SECRET: ${REVENUECAT_WEBHOOK_SECRET:-}
      # S3 / File storage
      S3_STORAGE: ${S3_STORAGE:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      # SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      # Firebase Cloud Messaging (firebase-admin)
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}

networks:
  vc-network:
    driver: bridge

volumes:
  pgdata:
